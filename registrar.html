<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - PORTAL INFORTECA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-white">Criar Nova Conta</h1>
            <p class="text-sm text-slate-400">Registe-se para aceder ao PORTAL INFORTECA</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
            
            <!-- Nome Completo -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nome Completo</label>
                <input type="text" id="nome" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
                    placeholder="O seu nome">
            </div>

            <!-- E-mail -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">E-mail</label>
                <input type="email" id="email" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
                    placeholder="seu.email@inforteca.com">
            </div>

            <!-- Palavra-passe -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Palavra-passe</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
                    placeholder="Mínimo 6 caracteres">
            </div>

            <!-- Mensagens de Alerta -->
            <div id="alertBox" class="hidden text-xs p-3 rounded-xl text-center border"></div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all duration-200 flex items-center justify-center space-x-2 text-sm active:scale-[0.98]">
                <span>Registar Utilizador</span>
            </button>
            
            <div class="text-center pt-4">
                <a href="index.html" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">Já tem conta? Faça Login aqui</a>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://zldugoqlcrzarpqvtaoh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsZHVnb3FsY3J6YXJwcXZ0YW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTU5NzUsImV4cCI6MjEwNjAzMTk3NX0.wUzL7ZmMdoksTVC_PlIiT1nDkhJnf7l0UYMcY-NShWA';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleRegister(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            // Feedback Visual
            submitBtn.disabled = true;
            submitBtn.innerHTML = `A processar...`;
            alertBox.classList.add('hidden');

            try {
                // 1. Criar utilizador no Supabase Auth
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: nome // Guarda o nome nos metadados do utilizador
                        }
                    }
                });

                if (error) throw error;

                // Sucesso!
                alertBox.textContent = "Conta criada com sucesso! A redirecionar para o painel...";
                alertBox.className = "text-xs p-3 rounded-xl text-center border bg-emerald-500/10 border-emerald-500/20 text-emerald-400";
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                alertBox.textContent = "Erro: " + error.message;
                alertBox.className = "text-xs p-3 rounded-xl text-center border bg-red-500/10 border-red-500/20 text-red-400";
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Registar Utilizador</span>`;
            }
        }
    </script>
</body>
</html>
