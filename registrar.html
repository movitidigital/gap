<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - PORTAL INFORTECA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f4f6f9] text-gray-800 min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal com estilo corporativo limpo -->
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
        
        <!-- Cabeçalho (Inspirado no Azul Marinho escuro da TIM) -->
        <div class="bg-[#000033] px-8 py-6 text-center border-b-4 border-[#0e8890]">
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <!-- Ícone vermelho TIM sutil e Nome INFORTECA -->
                <span class="text-[#E60000] text-3xl leading-none tracking-tighter">==</span> PORTAL INFORTECA
            </h1>
            <p class="text-sm text-gray-300 mt-1">Crie sua conta no sistema operacional</p>
        </div>

        <div class="p-8">
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-5">
                
                <!-- Nome Completo -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Nome Completo</label>
                    <input type="text" id="nome" required 
                        class="w-full bg-white border border-gray-300 rounded-md px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#0e8890] focus:ring-1 focus:ring-[#0e8890] transition-all text-sm"
                        placeholder="Seu nome e sobrenome">
                </div>

                <!-- E-mail -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">E-mail</label>
                    <input type="email" id="email" required 
                        class="w-full bg-white border border-gray-300 rounded-md px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#0e8890] focus:ring-1 focus:ring-[#0e8890] transition-all text-sm"
                        placeholder="seu.email@inforteca.com">
                </div>

                <!-- Senha -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Senha Sistêmica</label>
                    <input type="password" id="password" required minlength="6"
                        class="w-full bg-white border border-gray-300 rounded-md px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#0e8890] focus:ring-1 focus:ring-[#0e8890] transition-all text-sm"
                        placeholder="Mínimo de 6 caracteres">
                </div>

                <!-- Mensagens de Alerta -->
                <div id="alertBox" class="hidden text-sm p-3 rounded-md text-center border font-medium"></div>

                <!-- Botão Primário (Cor INFORTECA) -->
                <button type="submit" id="submitBtn" 
                    class="w-full bg-[#0e8890] hover:bg-[#0b6c72] text-white font-semibold py-3 px-4 rounded-md shadow-sm transition-colors duration-200 flex items-center justify-center space-x-2 text-sm mt-2">
                    <span>Registrar Usuário</span>
                </button>
                
                <div class="text-center pt-3">
                    <a href="index.html" class="text-sm text-[#000033] hover:text-[#0e8890] font-medium transition-colors">Já possui credenciais? Faça Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Credenciais do Supabase
        const SUPABASE_URL = 'https://zldugoqlcrzarpqvtaoh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsZHVnb3FsY3J6YXJwcXZ0YW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTU5NzUsImV4cCI6MjEwNjAzMTk3NX0.wUzL7ZmMdoksTVC_PlIiT1nDkhJnf7l0UYMcY-NShWA';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleRegister(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            // Feedback Visual de Carregamento
            submitBtn.disabled = true;
            submitBtn.innerHTML = `Processando...`;
            alertBox.classList.add('hidden');

            try {
                // Criar usuário no Supabase Auth
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: nome
                        }
                    }
                });

                if (error) throw error;

                // Sucesso
                alertBox.textContent = "Conta criada com sucesso! Redirecionando...";
                alertBox.className = "text-sm p-3 rounded-md text-center border bg-green-50 border-green-200 text-green-700 font-medium";
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                // Tratamento de Erro
                alertBox.textContent = "Erro: " + error.message;
                alertBox.className = "text-sm p-3 rounded-md text-center border bg-red-50 border-red-200 text-red-700 font-medium";
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Registrar Usuário</span>`;
            }
        }
    </script>
</body>
</html>
