function enviarVoucher(nome, link, botaoElemento) {
    const win = window.open(link, '_blank');
    if (!win) {
        alert('Por favor, autorize os pop-ups para abrir o WhatsApp.');
        return;
    }

    // Pega o usuário logado ou usa Sistema como fallback
    const atendente = typeof loggedUser !== 'undefined' ? loggedUser : "Sistema";
    const containerAcao = botaoElemento.parentElement;
    const conteudoOriginal = containerAcao.innerHTML;
    
    // Inicia feedback visual (Animação de Gravação)
    containerAcao.innerHTML = `
        <div class="flex flex-col items-end gap-1">
            <span class="text-[10px] font-black text-amber-500 animate-pulse uppercase italic">
                <i class="fas fa-sync fa-spin"></i> Gravando Nota...
            </span>
        </div>`;

    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.success) {
                // SUCESSO: Monta o visual com a CAMPANHA e o botão de Baixar
                // Usamos a campanha que vem do servidor (res.campanha)
                const campanha = res.campanha || "VOUCHER90DIAS40REAIS";
                
                containerAcao.innerHTML = `
                    <div class="flex flex-col items-end gap-1">
                        <span class="text-[8px] font-black text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100 uppercase tracking-tighter">
                            ${campanha}
                        </span>
                        <span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 italic">
                            Expira: ${res.validade}
                        </span>
                        <span class="text-[8px] text-slate-400 font-bold uppercase tracking-tighter">Por: ${res.atendente}</span>
                        <button onclick="usarVoucher('${nome}', this)" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-black hover:bg-slate-900 transition-all shadow-md active:scale-95 uppercase mt-1">
                            Baixar Voucher
                        </button>
                    </div>`;
            } else {
                alert("Erro ao gravar na planilha: " + (res ? res.message : "Erro desconhecido"));
                containerAcao.innerHTML = conteudoOriginal; 
            }
        })
        .withFailureHandler(function(err) {
            alert("Erro crítico de comunicação com o Google Sheets: " + err);
            containerAcao.innerHTML = conteudoOriginal; 
        })
        .registrarContatoLeads(nome, atendente); // <--- CORRIGIDO: Chama a função certa agora!
}

// --- FUNÇÃO PARA DAR BAIXA NO VOUCHER (USADO) ---
// 1. Função que apenas abre o Modal
function usarVoucher(nome, botaoElemento) {
  const modal = document.getElementById("modalConfirmacao");
  const content = document.getElementById("modalContent");
  const spanNome = document.getElementById("nomeClienteModal");
  const btnConfirmar = document.getElementById("btnConfirmarBaixa");

  spanNome.innerText = nome;

  // Exibe o modal com animação de entrada
  modal.classList.remove("hidden");
  setTimeout(() => {
    content.classList.remove("scale-95", "opacity-0");
    content.classList.add("scale-100", "opacity-100");
  }, 10);

  // Configura o clique do botão Confirmar para chamar a execução real
  btnConfirmar.onclick = function() {
    fecharModalConfirmacao();
    executarBaixaVoucher(nome, botaoElemento);
  };
}

// 2. Função para fechar o Modal com animação
function fecharModalConfirmacao() {
  const modal = document.getElementById("modalConfirmacao");
  const content = document.getElementById("modalContent");
  
  content.classList.remove("scale-100", "opacity-100");
  content.classList.add("scale-95", "opacity-0");
  
  setTimeout(() => modal.classList.add("hidden"), 300);
}

// 3. Função de Execução (Sua lógica original ajustada)
function executarBaixaVoucher(nome, botaoElemento) {
  const containerAcao = botaoElemento.closest('.container-acao');
  const tr = botaoElemento.closest('tr');
  const conteudoOriginal = containerAcao.innerHTML;
  
  containerAcao.innerHTML = `
    <div class="flex items-center gap-2">
      <i class="fas fa-circle-notch fa-spin text-indigo-600"></i>
      <span class="text-[10px] font-black text-indigo-600 uppercase">Processando...</span>
    </div>`;

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        tr.style.transition = "all 0.6s ease";
        tr.style.transform = "translateX(100px)";
        tr.style.opacity = "0";

        setTimeout(() => {
          carregarLeads(); // Recarrega os dados e a meta dinâmica
          if(typeof showToast === "function") showToast("Voucher baixado com sucesso!", "success");
        }, 600);
      } else {
        alert("Erro no servidor: " + (res ? res.message : "Erro desconhecido"));
        containerAcao.innerHTML = conteudoOriginal;
      }
    })
    .withFailureHandler(function(err) {
      alert("Falha crítica de conexão: " + err);
      containerAcao.innerHTML = conteudoOriginal;
    })
    .marcarVoucherUsado(nome);
}
    // --- Lógica de Inicialização Interna ---
    // Como o arquivo é injetado, chamamos a carga de dados imediatamente
    carregarLeads();

    // --- IMPORTAÇÃO ---
    function processarArquivoLeads(input) {
      const arquivo = input.files[0];
      if (!arquivo) return;

      const tipo = confirm("CLIQUE EM OK: Para PLANILHA 1 (Cadastro - Colunas B, G, L)\nCLIQUE EM CANCELAR: Para PLANILHA 2 (Vendas - Colunas B, C, I)") ? 1 : 2;
      const reader = new FileReader();
      
      const tbody = document.getElementById("listaLeads");
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 italic text-indigo-500 animate-pulse font-bold">Lendo e mapeando colunas da planilha...</td></tr>';

      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });
          const aba = workbook.Sheets[workbook.SheetNames[0]];
          const dadosBrutos = XLSX.utils.sheet_to_json(aba, { header: 1 });

          if (tipo === 1) {
            const listaCadastro = dadosBrutos.slice(2).filter(r => r[1]).map(r => ({
              nome: String(r[1] || "").trim().toUpperCase(),
              cpf: String(r[6] || "").replace(/\D/g, ''),
              telefone: String(r[11] || "").replace(/\D/g, '')
            }));

            if (listaCadastro.length === 0) throw new Error("Nenhum dado encontrado na Planilha 1.");

            google.script.run
              .withSuccessHandler(res => {
                alert(res.msg || "Clientes cadastrados com sucesso!");
                carregarLeads();
                input.value = "";
              })
              .importarPlanilha1Clientes(listaCadastro);

          } else {
            const listaVendas = dadosBrutos.slice(2).filter(r => r[1]).map(r => {
              let d = r[2];
              let dataFormatada = "";
              if (d instanceof Date) {
                const dia = String(d.getDate()).padStart(2, '0');
                const mes = String(d.getMonth() + 1).padStart(2, '0');
                const ano = d.getFullYear();
                dataFormatada = `${dia}/${mes}/${ano}`;
              } else if (d) {
                dataFormatada = String(d).trim();
              }

              return {
                nome: String(r[1] || "").trim().toUpperCase(),
                data: dataFormatada || new Date().toLocaleDateString('pt-BR'),
                valor: r[8] || 0
              };
            });

            if (listaVendas.length === 0) throw new Error("Nenhum dado encontrado na Planilha 2.");

            google.script.run
              .withSuccessHandler(res => {
                if(res.success){
                   alert("Vendas processadas! " + (res.contagem || "") + " registros vinculados.");
                   carregarLeads();
                } else {
                   alert("Erro: " + res.message);
                }
                input.value = "";
              })
              .importarPlanilha2Vendas(listaVendas);
          }

        } catch (erro) {
          alert("Erro ao processar: " + erro.message);
          carregarLeads();
        }
      };
      reader.readAsArrayBuffer(arquivo);
    }

    // --- MODAIS ---
    function abrirModalNovoLead() {
      document.getElementById("modalLead").classList.remove("hidden");
      document.getElementById("data").valueAsDate = new Date();
    }

    function fecharModal() {
      document.getElementById("modalLead").classList.add("hidden");
      ["nome", "cpf", "tel", "data", "valor"].forEach(id => document.getElementById(id).value = "");
    }

    // --- CRUD ---
    function salvarLead() {
      const btn = document.getElementById("btnSalvar");
      const dados = {
        nome: document.getElementById("nome").value.trim(),
        cpf: document.getElementById("cpf").value.trim(),
        telefone: document.getElementById("tel").value.trim(),
        data: document.getElementById("data").value,
        valor: document.getElementById("valor").value
      };

      if (!dados.nome || !dados.telefone) {
        alert("Nome e Telefone são obrigatórios!");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "SALVANDO...";

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerHTML = "Salvar Prospecto";
          if (res.success) {
            fecharModal();
            carregarLeads();
          }
        })
        .salvarLeadProspeccao(dados);
    }
// No prospec.html
function carregarLeads() {
  google.script.run
    .withSuccessHandler(function(dados) {
      // 'dados' é o objeto {leads: [], meta: X, convertidos: Y}
      renderizarLeads(dados); 
    })
    .getLeadsProspeccao();
}

/**
 * Renderiza a tabela de leads com meta dinâmica baseada no total da base.
 * @param {Array} leads - Lista de objetos de leads.
 * @param {Number} metaDinamica - O total de clientes qualificados para prospecção.
 */
/**
 * Renderiza a lista de prospecção e atualiza a meta baseada em conversões reais.
 * @param {Object} res - Objeto contendo {leads: Array, metaDinamica: Number, totalConvertidos: Number}
 */
function renderizarLeads(res) {
  // 1. Extração segura dos dados
  const leads = res.leads || [];
  const metaReal = res.metaDinamica || 0;
  const convertidosReal = res.totalConvertidos || 0;

  const tbody = document.getElementById("listaLeads");
  const badge = document.getElementById("badge-total");
  
  tbody.innerHTML = "";
  
  if (leads.length === 0 && convertidosReal === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-slate-400 uppercase font-bold text-xs tracking-widest">Nenhum cliente para prospecção hoje. 🎉</td></tr>';
    if(badge) badge.innerText = "SEM PENDÊNCIAS";
    return;
  }

  if(badge) badge.innerText = leads.length + " CLIENTES PENDENTES";

  // 2. Lógica para a Barra de Progresso
  const divisor = metaReal > 0 ? metaReal : 1;
  const percent = Math.min((convertidosReal / divisor) * 100, 100);
  
  const barraProgresso = document.getElementById("barra-progresso");
  const porcentagemTexto = document.getElementById("porcentagem-progresso");
  const textoProgresso = document.getElementById("texto-progresso");

  if(barraProgresso) {
    barraProgresso.style.width = percent + "%";
    barraProgresso.classList.remove('bg-indigo-600');
    barraProgresso.classList.add('bg-emerald-500');
  }
  
  if(porcentagemTexto) porcentagemTexto.innerText = Math.floor(percent) + "%";
  if(textoProgresso) {
    textoProgresso.innerText = `${convertidosReal} convertidos de uma base total de ${metaReal} clientes`;
  }

  // 3. Ordenação Estratégica
  leads.sort((a, b) => {
    if (a.status !== "CONTATADO" && b.status === "CONTATADO") return -1;
    if (a.status === "CONTATADO" && b.status !== "CONTATADO") return 1;
    const da = a.diasInativo === "∞" ? 999 : parseInt(a.diasInativo);
    const db = b.diasInativo === "∞" ? 999 : parseInt(b.diasInativo);
    return db - da;
  });

  // 4. Renderização das Linhas
  leads.forEach(lead => {
    const jaContatado = lead.status === "CONTATADO";
    const dias = lead.diasInativo === "∞" ? 0 : parseInt(lead.diasInativo);
    const ehCritico = dias >= 120 && !jaContatado;
    const linkWhats = generateLink(lead);

    const tr = document.createElement("tr");
    let bgClass = ehCritico ? 'bg-red-50/50 hover:bg-red-100/60' : 'hover:bg-slate-50';
    if (jaContatado) bgClass = 'bg-emerald-50/5 opacity-90';

    tr.className = `${bgClass} transition-colors border-b border-slate-50 group relative`;
    
    // --- AJUSTE DE CAMPANHA DINÂMICA ---
    // Se o servidor enviou a campanha, usa ela. Se não, mas o status é contatado, 
    // assume-se a campanha padrão atual para não ficar vazio.
    const nomeCampanha = lead.campanha || (jaContatado ? "VOUCHER90DIAS40REAIS" : "");

    let acaoHtml = jaContatado ? `
        <div class="flex flex-col items-end gap-1">
          <span class="text-[8px] font-black text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100 uppercase tracking-tighter shadow-sm">
            ${nomeCampanha}
          </span>
          <span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 italic">
            Expira: ${lead.validade}
          </span>
          <span class="text-[8px] text-slate-400 font-bold uppercase tracking-tighter">Por: ${lead.atendente || 'Sistema'}</span>
          <button onclick="usarVoucher('${lead.nome}', this)" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-black hover:bg-slate-900 transition-all shadow-md active:scale-95 uppercase mt-1">
            Baixar Voucher
          </button>
        </div>` : `
        <button onclick="enviarVoucher('${lead.nome}', '${linkWhats}', this)" class="bg-green-500 text-white px-4 py-2 rounded-xl text-[10px] font-black hover:bg-green-600 transition-all shadow-md flex items-center gap-2 active:scale-95 uppercase">
          <i class="fab fa-whatsapp text-xs"></i> Enviar Voucher
        </button>`;

    tr.innerHTML = `
      <td class="px-6 py-4">
        <div class="flex flex-col">
          <span class="font-black text-slate-700 uppercase text-sm tracking-tighter">${lead.nome}</span>
          <span class="text-[11px] text-slate-400 lowercase italic text-left">última compra em ${lead.ultimaCompra}</span>
        </div>
      </td>
      <td class="px-6 py-4 font-mono text-xs text-slate-400">${lead.cpf || '---'}</td>
      <td class="px-6 py-4">
        <span class="text-xs font-bold text-slate-600">${lead.telefone}</span>
      </td>
      <td class="px-6 py-4 font-black text-slate-700 text-sm">R$ ${Number(lead.valorTotal).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
      <td class="px-6 py-4">
        <div class="flex items-center justify-end gap-4">
          <div class="container-acao">${acaoHtml}</div>
          <div class="text-right min-w-[80px]">
              <span class="block text-[9px] font-black text-slate-300 uppercase">Inativo há</span>
              <span class="text-sm font-black ${jaContatado ? 'text-emerald-500' : (ehCritico ? 'text-red-600 animate-pulse' : 'text-red-500')}">
                 ${lead.diasInativo} <small class="text-[10px]">dias</small>
              </span>
          </div>
          <button onclick="confirmarExclusao('${lead.nome}')" 
                  class="flex items-center justify-center w-8 h-8 bg-slate-200 text-slate-500 rounded-full hover:bg-red-600 hover:text-white transition-all shadow-sm group/ignore" 
                  title="Ignorar este lead">
            <i class="fas fa-eye-slash text-xs"></i>
          </button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

    function filtrarLeads() {
      const termo = document.getElementById("filtroLead").value.toLowerCase();
      const linhas = document.querySelectorAll("#listaLeads tr");
      linhas.forEach(linha => {
        const texto = linha.innerText.toLowerCase();
        linha.style.display = texto.includes(termo) ? "" : "none";
      });
    }

    /**
 * Gera o link do WhatsApp com a mensagem personalizada.
 * @param {Object} lead - O objeto do cliente vindo do servidor.
 * @returns {string} - URL formatada para o WhatsApp.
 */
function generateLink(lead) {
    const primeiroNomeCliente = lead.nome.split(" ")[0].toUpperCase() || "CLIENTE";
    
    // Identifica o consultor dinamicamente sem nomes predefinidos
    let nomeConsultor = "da equipe TIM"; // Fallback genérico e profissional
    
    if (typeof loggedUser !== 'undefined' && loggedUser) {
        // Pega o primeiro nome, garante que seja minúsculo e depois capitaliza a primeira letra
        const nomePuro = loggedUser.trim().split(" ")[0].toLowerCase();
        if (nomePuro) {
            nomeConsultor = nomePuro.charAt(0).toUpperCase() + nomePuro.slice(1);
        }
    }

    // Define a validade (10 dias se não houver na planilha)
    let validadeMsg = lead.validade;
    if (!validadeMsg) {
        let d = new Date();
        d.setDate(d.getDate() + 10);
        validadeMsg = d.toLocaleDateString('pt-BR');
    }

    // Montagem estruturada da mensagem
    const msg = `Olá, ${primeiroNomeCliente}! ✨\n` +
                `Aqui quem fala é ${nomeConsultor}\n\n` +
                `Sentimos sua falta! 🏃‍♂️\n\n` +
                `Preparamos um presentão pra você: Um *VOUCHER DE R$ 40,00* exclusivo para você usar em nossa loja! 🎁\n\n` +
                `-----------------------------------\n` +
                `🎫 Cupom: *VOUCHER40*\n` +
                `💰 Desconto: *R$ 40,00*\n` +
                `🛍️ Condição: Compras a partir de R$ 199,00\n` +
                `📅 Válido até: ${validadeMsg}\n` +
                `-----------------------------------\n\n` +
                `Para usar, basta apresentar esta mensagem na loja e resgatar! 🎫🚀`;

    const numeroLimpo = String(lead.telefone).replace(/\D/g, '');
    
    // Retorna o link final
    return "https://api.whatsapp.com/send?phone=55" + numeroLimpo + "&text=" + encodeURIComponent(msg);
}

function confirmarExclusao(nome) {
    if (!confirm(`Deseja realmente IGNORAR o cliente ${nome}?\nEle não aparecerá mais nesta lista.`)) {
        return;
    }

    const usuario = typeof loggedUser !== 'undefined' ? loggedUser : "Sistema";

    // Mostra carregamento no portal para o usuário não clicar várias vezes
    if(typeof showLoading === "function") showLoading();

    google.script.run
        .withSuccessHandler(function(res) {
            if(typeof hideLoading === "function") hideLoading();
            if (res && res.success) {
                // Remove a linha e atualiza a lista
                carregarLeads();
                if(typeof showToast === "function") showToast("Cliente movido para ignorados.", "success");
            } else {
                alert("Erro: " + res.message);
            }
        })
        .withFailureHandler(function(err) {
            if(typeof hideLoading === "function") hideLoading();
            alert("Erro de conexão.");
        })
        .ignorarLeadProspeccao(nome, usuario);
}
  </script>
